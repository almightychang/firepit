[package]
name = "firepit-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "firepit"
path = "src/main.rs"

[dependencies]
firepit = { path = "../firepit" }
clap = { version = "4.6", features = ["derive"] }
safetensors = "0.8"
serde_json = "1"
sha2 = "0.10"
ureq = "3"

[dev-dependencies]
half.workspace = true
